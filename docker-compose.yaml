services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
        SECRET_KEY: ${SECRET_KEY}
        DEBUG: ${DEBUG}
        DB_HOST: db
        DB_PORT: ${DB_PORT}
    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:16.15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  postgres_data:

  
